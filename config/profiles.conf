# DOXA scan profiles. Selected with --mode <name>. "custom" uses --modules.
# Passive modules observe normal responses only; active modules send probes or run scanners.
# Module names: recon nmap whatweb http tls dns js api gobuster nikto nuclei params evidence

[passive]
description=Passive reconnaissance: normal page requests, headers, cookies, TLS handshake. No scanners, no path guessing.
modules=recon,whatweb,http,tls,dns,js,evidence
threads=1
rate=5

[standard]
description=Standard security assessment: passive set plus nmap web ports, exposed-file probes, gobuster, nikto and nuclei with safe settings.
modules=recon,nmap,whatweb,http,tls,dns,js,api,gobuster,nikto,nuclei,evidence
threads=10
rate=30

[full]
description=Full non-destructive assessment: deeper nmap/gobuster/nikto/nuclei plus approved parameter indicator probing.
modules=recon,nmap,whatweb,http,tls,dns,js,api,gobuster,nikto,nuclei,params,evidence
threads=20
rate=100

[custom]
description=Custom assessment: choose modules with --modules a,b,c
modules=recon,http,tls
threads=10
rate=30
