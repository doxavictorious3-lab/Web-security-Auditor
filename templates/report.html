<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>DOXA Web Security Auditor - Report</title>
<style>
:root{--bg:#050b0a;--panel:#0b1715;--panel2:#0e1f1c;--line:#12332c;--green:#39ff14;--cyan:#00e5ff;--text:#cfe9e2;--dim:#7fa59a;
--crit:#ff2d55;--high:#ff6b35;--med:#ffc107;--low:#3fa9f5;--info:#8a9ba8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 "Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:24px}
header.top{border-bottom:2px solid var(--green);padding-bottom:16px;margin-bottom:24px}
header.top h1{margin:0;color:var(--green);font-family:"Courier New",monospace;letter-spacing:3px}
header.top p{margin:4px 0 0;color:var(--cyan)}
nav{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
nav a{color:var(--cyan);text-decoration:none;border:1px solid var(--line);border-radius:4px;padding:2px 10px;font-size:13px}
h2{color:var(--cyan);border-bottom:1px solid var(--line);padding-bottom:6px;margin-top:38px}
h3{margin:0;font-size:16px}h4{color:var(--green);margin:14px 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:1px}
section,article{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px 20px;margin:14px 0}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--dim);font-weight:600;width:200px}table.grid th{width:auto}
pre{background:#030807;border:1px solid var(--line);border-radius:6px;padding:10px;overflow-x:auto;white-space:pre-wrap;word-break:break-word;color:#9fe8c4;font-size:12.5px}
code{color:var(--green)}
.badge{display:inline-block;padding:2px 10px;border-radius:4px;font-weight:700;font-size:12px;color:#000;margin-right:10px}
.sev-CRITICAL{background:var(--crit)}.sev-HIGH{background:var(--high)}.sev-MEDIUM{background:var(--med)}.sev-LOW{background:var(--low)}.sev-INFORMATIONAL{background:var(--info)}
.fhead{display:flex;align-items:center;border-left:5px solid var(--line);padding-left:10px}
.fhead.sev-CRITICAL{border-color:var(--crit);background:none}.fhead.sev-HIGH{border-color:var(--high);background:none}.fhead.sev-MEDIUM{border-color:var(--med);background:none}.fhead.sev-LOW{border-color:var(--low);background:none}.fhead.sev-INFORMATIONAL{border-color:var(--info);background:none}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:12px;text-align:center}
.card b{display:block;font-size:28px;font-family:"Courier New",monospace}
.card.c-CRITICAL b{color:var(--crit)}.card.c-HIGH b{color:var(--high)}.card.c-MEDIUM b{color:var(--med)}.card.c-LOW b{color:var(--low)}.card.c-INFORMATIONAL b{color:var(--info)}
.bar{background:#0a1f1b;border-radius:4px;height:16px;overflow:hidden;min-width:180px}.bar span{display:block;height:100%}
.st-OK{color:var(--green)}.st-SKIPPED{color:var(--dim)}.st-FAILED,.st-TIMEOUT,.st-INTERRUPTED{color:var(--crit)}
.risk{font-size:22px;font-weight:700;color:var(--green)}
.note{color:var(--dim);font-size:13px}
footer{margin:40px 0;color:var(--dim);text-align:center;font-size:12px}
img.shot{max-width:100%;border:1px solid var(--line);border-radius:6px}
@media print{
body{background:#fff!important;color:#000!important}
nav{display:none!important}
section,article{break-inside:avoid;border-color:#999!important;background:#fff!important}
pre{background:#f4f4f4!important;color:#000!important;border-color:#bbb!important}
.card{background:#fff!important;border-color:#999!important;color:#000!important}
.card.c-CRITICAL b{color:#b00020!important}.card.c-HIGH b{color:#c2410c!important}.card.c-MEDIUM b{color:#9a6700!important}.card.c-LOW b{color:#1d4ed8!important}.card.c-INFORMATIONAL b{color:#555!important}
th,h2,h3,h4,code,.risk,.note,header.top h1,header.top p,footer{color:#000!important}
a{color:#0645ad!important}
.bar{background:#ddd!important}
th,td{border-color:#ccc!important}
}
</style></head><body><div class="wrap">
<header class="top"><h1>DOXA WEB SECURITY AUDITOR</h1><p>Security assessment report &mdash; @@TARGET@@</p></header>
@@BODY@@
<footer>Generated by DOXA Web Security Auditor v@@VERSION@@ &mdash; confidential. Automated findings require manual validation. No cloud service was used to produce this report.</footer>
</div></body></html>
